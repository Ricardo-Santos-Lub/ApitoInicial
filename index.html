<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApitoInicial</title>
  <link rel="stylesheet" href="vendor/shoelace/themes/light.css">
  <link rel="stylesheet" href="css/shoelace-tema.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0a58ff">
  <!-- Precisa ser um caminho absoluto (começando com "/"): o autoloader do Shoelace usa
       import() dinâmico por trás dos panos, e import() não resolve caminhos relativos "soltos". -->
  <script type="module" src="/vendor/shoelace/shoelace-autoloader.js"></script>
</head>
<body>
  <header class="app-header">
    <button class="app-header-botao-inicio ripple" id="btnVoltarInicio" type="button" aria-label="Voltar ao início (reinicia a partida atual)" title="Voltar ao início"></button>
    <h1>⚽ ApitoInicial</h1>
    <p class="app-subtitulo">Súmula digital em tempo real</p>
  </header>

  <main id="app">
    <!-- telas são injetadas aqui via JS -->
  </main>

  <script type="module" src="js/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
